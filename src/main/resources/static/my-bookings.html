<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEmatrix — My Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg xcinema-nav">
    <div class="container">
        <a class="navbar-brand" href="movies.html">🎬 <span class="brand-cine">CINE</span><span class="brand-matrix">matrix</span></a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto align-items-center gap-1">
                <li class="nav-item"><a class="nav-link" href="movies.html">🎬 Movies</a></li>
                <li class="nav-item"><a class="nav-link active-link" href="my-bookings.html">🎟️ My Bookings</a></li>
                <li class="nav-item"><a class="nav-link" href="reviews.html">⭐ Reviews</a></li>
                <li class="nav-item"><a class="nav-link" href="profile.html">👤 Profile</a></li>
                <li class="nav-item"><a class="nav-link danger-link" href="index.html" onclick="localStorage.clear()">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="page-wrapper">
<div class="container" style="max-width:800px">

    <h1 class="section-title">My <span>Bookings</span></h1>
    <p class="section-subtitle">All your reserved tickets</p>

    <div id="bookingsList">
        <div class="text-center py-5">
            <div class="spinner-border text-danger"></div>
            <p class="mt-2" style="color:var(--text-muted)">Loading bookings...</p>
        </div>
    </div>

</div>
</div>

<!-- CANCEL CONFIRM MODAL -->
<div class="modal fade" id="cancelModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content dark-card border-0">
            <div class="modal-header" style="border-color:var(--border)">
                <h5 class="modal-title">Cancel Booking</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">Are you sure you want to cancel this booking?</div>
            <div class="modal-footer" style="border-color:var(--border)">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Keep it</button>
                <button class="btn custom-btn" id="confirmCancelBtn">Yes, Cancel</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = 'http://localhost:8080';
const userId   = localStorage.getItem('userId');
const userName = localStorage.getItem('userName');
if (!userName) window.location.href = 'index.html';

let cancelTarget = null;

async function loadBookings() {
    const el = document.getElementById('bookingsList');
    try {
        const res = await fetch(`${API}/bookings/user/${userId}`);
        const bookings = await res.json();

        if (!bookings.length) {
            el.innerHTML = `<div class="text-center py-5" style="color:var(--text-muted)">
                <div style="font-size:3rem">🎟️</div>
                <p class="mt-2">No bookings yet. <a href="movies.html" style="color:var(--red)">Browse movies</a></p>
            </div>`;
            return;
        }

        el.innerHTML = bookings.map(b => `
            <div class="booking-card">
                <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <span style="font-size:1.3rem">${b.ticketType === 'BALCONY' ? '🎭' : '🪑'}</span>
                            <span class="fw-bold fs-6">Movie ID: ${b.movieId}</span>
                            <span class="badge-status ${b.ticketType === 'BALCONY' ? 'badge-now' : ''}"
                                  style="${b.ticketType !== 'BALCONY' ? 'background:rgba(100,100,255,0.7);color:white' : ''}">
                                ${b.ticketType}
                            </span>
                        </div>
                        <p class="mb-1" style="color:var(--text-muted);font-size:0.85rem">
                            🪑 Seat: <strong style="color:white">${b.seatId}</strong>
                            &nbsp;|&nbsp; 🕐 ${b.showtime}
                        </p>
                        <p class="mb-0" style="color:var(--text-muted);font-size:0.78rem">Booking ID: ${b.bookingId}</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="reviews.html?movieId=${b.movieId}" class="btn btn-outline-red btn-sm">⭐ Review</a>
                        <button class="btn btn-sm" style="border:1px solid rgba(255,100,100,0.4);color:#ff6b6b;border-radius:8px"
                            onclick="askCancel('${b.bookingId}')">Cancel</button>
                    </div>
                </div>
            </div>
        `).join('');

    } catch(e) {
        el.innerHTML = `<div class="text-center py-4" style="color:#ff6b6b">Could not load bookings.</div>`;
    }
}

function askCancel(bookingId) {
    cancelTarget = bookingId;
    new bootstrap.Modal(document.getElementById('cancelModal')).show();
}

document.getElementById('confirmCancelBtn').addEventListener('click', async () => {
    if (!cancelTarget) return;
    try {
        await fetch(`${API}/bookings/delete/${cancelTarget}`, { method: 'DELETE' });
        bootstrap.Modal.getInstance(document.getElementById('cancelModal')).hide();
        loadBookings();
    } catch(e) { alert('Error cancelling booking.'); }
});

loadBookings();
</script>
</body>
</html>
